<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quest 3 Sci-Fi Superhero Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- A-Frame 1.6.0 Core -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // --- GLOBAL GAME STATE ---
    window.GameState = {
      playerHP: 100,
      playerMaxHP: 100,
      score: 0,
      gunEquipped: false,
      shieldActive: false,
      isGameOver: false,
      robots: []
    };

    function updateHUD() {
      const hpBar = document.getElementById('player-hp-bar');
      const hudText = document.getElementById('player-hud-text');
      if (!hpBar || !hudText) return;

      const ratio = Math.max(0, window.GameState.playerHP / window.GameState.playerMaxHP);
      hpBar.setAttribute('scale', `${ratio} 1 1`);

      if (window.GameState.isGameOver) {
        hudText.setAttribute('value', `MISSION FAILED! SCORE: ${window.GameState.score}\nPULL RIGHT TRIGGER TO RESTART`);
        hudText.setAttribute('color', '#ef4444');
      } else {
        hudText.setAttribute('value', `HP: ${window.GameState.playerHP}%  |  SCORE: ${window.GameState.score}`);
        hudText.setAttribute('color', '#38bdf8');
      }
    }

    // --- RIGHT JOYSTICK SMOOTH LOCOMOTION & PICKUP ---
    AFRAME.registerComponent('right-stick-locomotion', {
      schema: { speed: { default: 3.5 } },
      init: function () {
        this.rig = document.getElementById('rig');
        this.camera = document.getElementById('camera');
        this.axisX = 0;
        this.axisY = 0;

        // Thumbstick axes
        this.el.addEventListener('axismove', (e) => {
          const axis = e.detail.axis;
          if (axis.length >= 2) {
            this.axisX = axis[0];
            this.axisY = axis[1];
          }
          if (axis.length >= 4 && (Math.abs(axis[2]) > 0.1 || Math.abs(axis[3]) > 0.1)) {
            this.axisX = axis[2];
            this.axisY = axis[3];
          }
        });

        // Joystick click or grip button to equip gun
        this.el.addEventListener('thumbstickdown', () => this.tryEquipGun());
        this.el.addEventListener('gripdown', () => this.tryEquipGun());
      },
      tryEquipGun: function () {
        if (window.GameState.gunEquipped) return;
        const rigPos = this.rig.object3D.position;
        const pedestal = document.getElementById('pedestal');
        if (pedestal) {
          const pPos = pedestal.object3D.position;
          // Check if player is near pedestal (< 3.5m)
          if (rigPos.distanceTo(pPos) < 3.5) {
            window.GameState.gunEquipped = true;
            document.getElementById('gun-world-model').setAttribute('visible', 'false');
            document.getElementById('right-hand-gun').setAttribute('visible', 'true');
            document.getElementById('equip-hint').setAttribute('visible', 'false');
          }
        }
      },
      tick: function (time, delta) {
        if (!delta || (Math.abs(this.axisX) < 0.15 && Math.abs(this.axisY) < 0.15)) return;

        // Auto pickup if walking right into the pedestal
        if (!window.GameState.gunEquipped) {
          this.tryEquipGun();
        }

        const moveSpeed = (this.data.speed * delta) / 1000;
        const camYaw = this.camera.object3D.rotation.y;

        const dx = this.axisX * Math.cos(camYaw) + this.axisY * Math.sin(camYaw);
        const dz = -this.axisX * Math.sin(camYaw) + this.axisY * Math.cos(camYaw);

        this.rig.object3D.position.x += dx * moveSpeed;
        this.rig.object3D.position.z += dz * moveSpeed;
      }
    });

    // --- LEFT CONTROLLER: SUPERHERO SHIELD ---
    AFRAME.registerComponent('left-controller-shield', {
      init: function () {
        this.shieldMesh = document.getElementById('superhero-shield');
        this.el.addEventListener('triggerdown', () => {
          window.GameState.shieldActive = true;
          this.shieldMesh.setAttribute('visible', 'true');
        });
        this.el.addEventListener('triggerup', () => {
          window.GameState.shieldActive = false;
          this.shieldMesh.setAttribute('visible', 'false');
        });
      }
    });

    // --- RIGHT CONTROLLER: PRECISION BLASTER ---
    AFRAME.registerComponent('right-controller-blaster', {
      init: function () {
        this.el.addEventListener('triggerdown', () => {
          if (window.GameState.isGameOver) {
            // Restart game on trigger pull
            window.GameState.playerHP = 100;
            window.GameState.score = 0;
            window.GameState.isGameOver = false;
            updateHUD();
            return;
          }
          if (!window.GameState.gunEquipped) return;
          this.fireLaser();
        });
      },
      fireLaser: function () {
        const scene = this.el.sceneEl;
        const muzzle = document.getElementById('gun-muzzle');
        const gunModel = document.getElementById('right-hand-gun');
        
        // Accurate muzzle world position
        const spawnPos = new THREE.Vector3();
        muzzle.object3D.getWorldPosition(spawnPos);

        // Calculate forward direction along barrel sightline (-Z in Three.js)
        const worldQuat = new THREE.Quaternion();
        gunModel.object3D.getWorldQuaternion(worldQuat);
        const fireDir = new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat).normalize();

        // Projectile container
        const laser = document.createElement('a-entity');
        laser.object3D.position.copy(spawnPos);
        laser.object3D.quaternion.copy(worldQuat);

        // Visual beam aligned with travel path
        const beam = document.createElement('a-cylinder');
        beam.setAttribute('radius', '0.018');
        beam.setAttribute('height', '0.5');
        beam.setAttribute('rotation', '90 0 0');
        beam.setAttribute('material', 'color: #00ffff; emissive: #00ffff; emissiveIntensity: 3');
        laser.appendChild(beam);

        laser.setAttribute('projectile', {
          direction: `${fireDir.x} ${fireDir.y} ${fireDir.z}`,
          speed: 35,
          isEnemy: false
        });

        scene.appendChild(laser);
      }
    });

    // --- BULLET & PROJECTILE PHYSICS ---
    AFRAME.registerComponent('projectile', {
      schema: {
        direction: { type: 'vec3' },
        speed: { default: 20 },
        isEnemy: { default: false },
        life: { default: 3.5 }
      },
      init: function () {
        this.dir = new THREE.Vector3(this.data.direction.x, this.data.direction.y, this.data.direction.z).normalize();
        this.age = 0;
      },
      tick: function (t, dt) {
        if (!dt) return;
        const step = (this.data.speed * dt) / 1000;
        this.el.object3D.position.addScaledVector(this.dir, step);
        this.age += dt / 1000;

        if (this.age > this.data.life) {
          this.destroyProjectile();
          return;
        }

        const bulletPos = this.el.object3D.position;

        // Player laser hitting Robots
        if (!this.data.isEnemy) {
          for (let robotEl of window.GameState.robots) {
            if (!robotEl.parentNode || robotEl.components['enemy-robot'].isDead) continue;
            const rPos = robotEl.object3D.position;
            if (bulletPos.distanceTo(rPos) < 1.0) {
              robotEl.components['enemy-robot'].takeDamage(35);
              this.destroyProjectile();
              return;
            }
          }
        } 
        // Robot laser hitting Player or Shield
        else {
          if (window.GameState.isGameOver) {
            this.destroyProjectile();
            return;
          }

          // 1. Check Shield Collision
          if (window.GameState.shieldActive) {
            const shieldEl = document.getElementById('superhero-shield');
            const shieldPos = new THREE.Vector3();
            shieldEl.object3D.getWorldPosition(shieldPos);

            if (bulletPos.distanceTo(shieldPos) < 0.85) {
              // Visual shield impact flash
              const outerRing = document.getElementById('shield-outer-ring');
              if (outerRing) {
                outerRing.setAttribute('material', 'emissiveIntensity', 4);
                setTimeout(() => outerRing.setAttribute('material', 'emissiveIntensity', 1.8), 120);
              }
              this.destroyProjectile();
              return;
            }
          }

          // 2. Check Player Hit
          const cam = document.getElementById('camera');
          const playerPos = new THREE.Vector3();
          cam.object3D.getWorldPosition(playerPos);

          if (bulletPos.distanceTo(playerPos) < 0.7) {
            window.GameState.playerHP = Math.max(0, window.GameState.playerHP - 15);
            if (window.GameState.playerHP === 0) {
              window.GameState.isGameOver = true;
            }
            updateHUD();
            this.destroyProjectile();
            return;
          }
        }
      },
      destroyProjectile: function () {
        if (this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    });

    // --- ENEMY ROBOT CONTROLLER (SMOOTH RESPAWN & HEALTH) ---
    AFRAME.registerComponent('enemy-robot', {
      schema: { hp: { default: 100 } },
      init: function () {
        this.maxHp = this.data.hp;
        this.currentHp = this.data.hp;
        this.isDead = false;
        this.shootTimer = Math.random() * 2 + 1.5;
        this.targetPos = new THREE.Vector3((Math.random() - 0.5) * 14, 1.8 + Math.random(), -5 - Math.random() * 8);

        window.GameState.robots.push(this.el);
        this.hpBar = this.el.querySelector('.robot-hp-fill');
      },
      tick: function (t, dt) {
        if (!dt || this.isDead) return;

        const cam = document.getElementById('camera');
        const worldPlayerPos = new THREE.Vector3();
        cam.object3D.getWorldPosition(worldPlayerPos);

        // Smooth cruising within arena bounds
        this.el.object3D.position.lerp(this.targetPos, 0.02);
        if (this.el.object3D.position.distanceTo(this.targetPos) < 0.8) {
          this.targetPos.set(
            (Math.random() - 0.5) * 14,
            1.6 + Math.random() * 1.2,
            -4 - Math.random() * 8
          );
        }

        // Face player
        this.el.object3D.lookAt(worldPlayerPos.x, this.el.object3D.position.y, worldPlayerPos.z);

        // Shooting cycle
        if (!window.GameState.isGameOver) {
          this.shootTimer -= dt / 1000;
          if (this.shootTimer <= 0) {
            this.shootAtPlayer(worldPlayerPos);
            this.shootTimer = 2.5 + Math.random() * 2;
          }
        }
      },
      shootAtPlayer: function (targetVec) {
        const scene = this.el.sceneEl;
        const robotPos = this.el.object3D.position.clone();
        robotPos.y += 0.1;

        const dir = new THREE.Vector3().subVectors(targetVec, robotPos).normalize();

        const bolt = document.createElement('a-entity');
        bolt.setAttribute('geometry', { primitive: 'sphere', radius: 0.1 });
        bolt.setAttribute('material', { color: '#ff1744', emissive: '#ff1744', emissiveIntensity: 2.5 });
        bolt.object3D.position.copy(robotPos);

        bolt.setAttribute('projectile', {
          direction: `${dir.x} ${dir.y} ${dir.z}`,
          speed: 11,
          isEnemy: true
        });

        scene.appendChild(bolt);
      },
      takeDamage: function (amount) {
        if (this.isDead) return;
        this.currentHp -= amount;
        const ratio = Math.max(0, this.currentHp / this.maxHp);
        if (this.hpBar) {
          this.hpBar.setAttribute('scale', `${ratio} 1 1`);
        }

        // Hit flash
        const core = this.el.querySelector('.robot-core');
        core.setAttribute('material', 'color', '#ffffff');
        setTimeout(() => core.setAttribute('material', 'color', '#334155'), 70);

        if (this.currentHp <= 0) {
          this.die();
        }
      },
      die: function () {
        this.isDead = true;
        // Award point
        window.GameState.score += 1;
        updateHUD();

        // Death shrink animation instead of midair pop
        this.el.setAttribute('animation', {
          property: 'scale',
          to: '0.01 0.01 0.01',
          dur: 250,
          easing: 'easeInQuad'
        });

        setTimeout(() => {
          this.el.setAttribute('visible', 'false');
          // Smooth respawn after 2.5 seconds
          setTimeout(() => {
            this.respawn();
          }, 2500);
        }, 250);
      },
      respawn: function () {
        const rx = (Math.random() - 0.5) * 14;
        const rz = -5 - Math.random() * 8;
        // Spawn from high ceiling and swoop in
        this.el.object3D.position.set(rx, 6, rz);
        this.currentHp = this.maxHp;
        if (this.hpBar) this.hpBar.setAttribute('scale', '1 1 1');

        this.el.removeAttribute('animation');
        this.el.setAttribute('scale', '1 1 1');
        this.el.setAttribute('visible', 'true');

        this.targetPos.set(rx, 1.8 + Math.random(), rz);
        this.isDead = false;
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #030712">
    <!-- Lighting -->
    <a-entity light="type: ambient; color: #64748b; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.9" position="4 12 5"></a-entity>

    <!-- Sci-Fi Arena Floor -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="28" height="28" color="#0f172a" roughness="0.9"></a-plane>
    <a-grid width="28" height="28" color="#0284c7" opacity="0.12"></a-grid>
    <a-cylinder position="0 2.5 -14" radius="14" height="5" side="back" open-ended="true" color="#020617"></a-cylinder>

    <!-- Gun Pedestal & Pickup Zone -->
    <a-box id="pedestal" position="0 0.5 -2.2" width="0.7" height="1" depth="0.7" color="#1e293b"></a-box>
    <a-ring position="0 0.02 -2.2" rotation="-90 0 0" radius-inner="0.8" radius-outer="0.9" material="color: #00ffff; opacity: 0.4; transparent: true"></a-ring>

    <!-- Floating Blaster on Pedestal -->
    <a-entity id="gun-world-model" position="0 1.15 -2.2" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      <a-box width="0.06" height="0.1" depth="0.26" color="#0284c7"></a-box>
      <a-cylinder position="0 0.03 -0.16" rotation="90 0 0" radius="0.02" height="0.2" color="#00ffff"></a-cylinder>
      <a-box position="0 -0.06 0.05" rotation="20 0 0" width="0.05" height="0.1" depth="0.06" color="#090d16"></a-box>
    </a-entity>

    <!-- Prompt Billboard -->
    <a-text 
      id="equip-hint"
      value="STEP CLOSE & PUSH/CLICK RIGHT JOYSTICK\nTO EQUIP BLASTER" 
      align="center" 
      position="0 1.7 -2.2" 
      scale="0.55 0.55 0.55" 
      color="#38bdf8">
    </a-text>

    <!-- PLAYER RIG -->
    <a-entity id="rig" position="0 0 1">
      <!-- Head / Camera -->
      <a-camera id="camera" position="0 1.6 0">
        <!-- Floating HUD (Score & Health) -->
        <a-entity id="player-hud" position="0 -0.38 -0.8">
          <a-plane width="0.65" height="0.06" color="#450a0a" opacity="0.85"></a-plane>
          <a-plane id="player-hp-bar" width="0.65" height="0.06" color="#22c55e" position="0 0 0.002"></a-plane>
          <a-text id="player-hud-text" value="HP: 100%  |  SCORE: 0" align="center" position="0 0.07 0" scale="0.22 0.22 0.22" color="#38bdf8"></a-text>
        </a-entity>
      </a-camera>

      <!-- LEFT HAND: SUPERHERO SHIELD -->
      <a-entity id="leftHand" hand-controls="hand: left" left-controller-shield>
        <!-- Superhero Shield Geometry (Anchored to Left Forearm, Facing Outward) -->
        <a-entity id="superhero-shield" position="0 0.06 -0.15" rotation="-15 0 0" visible="false">
          <!-- Outer Energy Rim -->
          <a-ring id="shield-outer-ring" radius-inner="0.48" radius-outer="0.53" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1.8; side: double"></a-ring>
          <!-- Translucent Main Vibranium/Energy Barrier -->
          <a-circle radius="0.5" material="color: #0369a1; opacity: 0.55; transparent: true; roughness: 0.2; metalness: 0.8; side: double"></a-circle>
          <!-- Inner Concentric Ring -->
          <a-ring radius-inner="0.28" radius-outer="0.32" material="color: #ffffff; emissive: #38bdf8; emissiveIntensity: 1.4; side: double"></a-ring>
          <!-- Superhero Center Star / Crest -->
          <a-box width="0.16" height="0.03" depth="0.01" rotation="0 0 0" material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1.5"></a-box>
          <a-box width="0.16" height="0.03" depth="0.01" rotation="0 0 90" material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1.5"></a-box>
          <a-box width="0.16" height="0.03" depth="0.01" rotation="0 0 45" material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1.5"></a-box>
          <a-box width="0.16" height="0.03" depth="0.01" rotation="0 0 -45" material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1.5"></a-box>
        </a-entity>
      </a-entity>

      <!-- RIGHT HAND: PRECISION BLASTER & LOCOMOTION -->
      <a-entity id="rightHand" hand-controls="hand: right" right-stick-locomotion right-controller-blaster>
        <!-- Hand Gun (Grip rotated to align naturally with Quest hand controller) -->
        <a-entity id="right-hand-gun" visible="false" position="0 -0.02 -0.1" rotation="-18 0 0">
          <!-- Receiver & Barrel -->
          <a-box width="0.05" height="0.08" depth="0.25" color="#0284c7"></a-box>
          <a-cylinder position="0 0.025 -0.15" rotation="90 0 0" radius="0.018" height="0.18" color="#00ffff"></a-cylinder>
          <!-- Handle positioned directly in palm -->
          <a-box position="0 -0.06 0.04" rotation="20 0 0" width="0.04" height="0.11" depth="0.05" color="#0b0f19"></a-box>
          <!-- Muzzle Spawn Point (Front tip of barrel) -->
          <a-entity id="gun-muzzle" position="0 0.025 -0.25"></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ENEMY ROBOT 1 -->
    <a-entity id="robot1" enemy-robot position="-4 1.8 -7">
      <a-box class="robot-core" width="0.6" height="0.6" depth="0.6" color="#334155"></a-box>
      <a-sphere position="0 0.15 0.3" radius="0.12" color="#ff1744" material="emissive: #ff1744; emissiveIntensity: 1.5"></a-sphere>
      <!-- Overhead Health Bar -->
      <a-entity position="0 0.7 0">
        <a-plane width="0.8" height="0.08" color="#991b1b"></a-plane>
        <a-plane class="robot-hp-fill" width="0.8" height="0.08" color="#22c55e" position="0 0 0.005"></a-plane>
      </a-entity>
    </a-entity>

    <!-- ENEMY ROBOT 2 -->
    <a-entity id="robot2" enemy-robot position="4 2.1 -9">
      <a-box class="robot-core" width="0.6" height="0.6" depth="0.6" color="#334155"></a-box>
      <a-sphere position="0 0.15 0.3" radius="0.12" color="#ff1744" material="emissive: #ff1744; emissiveIntensity: 1.5"></a-sphere>
      <!-- Overhead Health Bar -->
      <a-entity position="0 0.7 0">
        <a-plane width="0.8" height="0.08" color="#991b1b"></a-plane>
        <a-plane class="robot-hp-fill" width="0.8" height="0.08" color="#22c55e" position="0 0 0.005"></a-plane>
      </a-entity>
    </a-entity>

    <!-- ENEMY ROBOT 3 -->
    <a-entity id="robot3" enemy-robot position="0 2.4 -11">
      <a-box class="robot-core" width="0.6" height="0.6" depth="0.6" color="#334155"></a-box>
      <a-sphere position="0 0.15 0.3" radius="0.12" color="#ff1744" material="emissive: #ff1744; emissiveIntensity: 1.5"></a-sphere>
      <!-- Overhead Health Bar -->
      <a-entity position="0 0.7 0">
        <a-plane width="0.8" height="0.08" color="#991b1b"></a-plane>
        <a-plane class="robot-hp-fill" width="0.8" height="0.08" color="#22c55e" position="0 0 0.005"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
